name: Update and Deploy Songs Data

on:
  schedule:
    # 毎日 午前3時 (UTC 18:00) に自動更新
    - cron: '0 18 * * *'
  workflow_dispatch: # GitHub画面から手動実行可能にする
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

# GitHub Pages へのデプロイ権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch and generate JSON
        env:
          GAS_API_URL: ${{ secrets.GAS_API_URL }}
        run: |
          python scripts/fetch_songs.py

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
